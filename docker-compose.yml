services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vet
      POSTGRES_PASSWORD: vet
      POSTGRES_DB: vetmvp
    volumes:
      - vet_pg_data:/var/lib/postgresql/data
    networks:
      - stack
    # Порт 5432 не публикуем на хост — только внутренняя сеть stack.

  backend:
    build:
      context: ./backend
    # Подхватывает JWT, SMTP, FRONTEND_URL и др. из файла в корне репозитория. Если файла нет — создайте: touch .env
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://vet:vet@postgres:5432/vetmvp
      TRUST_PROXY: "1"
      # JWT и прочее из .env (см. backend/.env.example). Почта пользователям: SMTP_HOST + SMTP_FROM + FRONTEND_URL;
      # служебные алерты админу — ещё ALERT_EMAIL_TO.
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_VISION_MODEL: llava:7b
    depends_on:
      - postgres
      - ollama
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - stack
    # API снаружи только через контейнер web (nginx) и NPM.

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - stack

  web:
    build:
      context: ./VETEXPERT
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    networks:
      stack: {}
      proxy:
        aliases:
          - web

  # --- Monitoring stack (internal-only; accessed via /grafana and /prometheus) ---
  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.external-url=/prometheus/"
      - "--web.route-prefix=/prometheus"
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - stack

  grafana:
    image: grafana/grafana:latest
    environment:
      # Serve behind subpath /grafana (must be a public URL; otherwise Grafana may redirect to localhost)
      # Set on server in .env if domain differs.
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-vetconnect.online}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://vetconnect.online/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ENFORCE_DOMAIN: "false"
      # iframe с того же домена (админка); иначе Grafana может резать загрузку UI.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Rely on nginx basic-auth; allow anonymous viewer for iframe embed.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - stack

  node-exporter:
    image: prom/node-exporter:latest
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - stack

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - stack

volumes:
  vet_pg_data:
  backend_uploads:
  ollama_data:
  grafana_data:
  prometheus_data:

networks:
  stack:
    driver: bridge
  proxy:
    external: true

