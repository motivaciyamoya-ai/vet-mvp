services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vet
      POSTGRES_PASSWORD: vet
      POSTGRES_DB: vetmvp
    volumes:
      - vet_pg_data:/var/lib/postgresql/data
    networks:
      - stack
    # Порт 5432 не публикуем на хост — только внутренняя сеть stack.

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://vet:vet@postgres:5432/vetmvp
      TRUST_PROXY: "1"
      # Если вы используете JWT/SMTP/Push — заполните эти значения в .env (см backend/.env.example)
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_VISION_MODEL: llava:7b
    depends_on:
      - postgres
      - ollama
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - stack
    # API снаружи только через контейнер web (nginx) и NPM.

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - stack

  web:
    build:
      context: ./VETEXPERT
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    networks:
      stack: {}
      proxy:
        aliases:
          - web

volumes:
  vet_pg_data:
  backend_uploads:
  ollama_data:

networks:
  stack:
    driver: bridge
  proxy:
    external: true

