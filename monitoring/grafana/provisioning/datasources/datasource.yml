apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Должен совпадать с uid в дашбордах (vetconnect-host-and-containers.json).
    uid: Prometheus
    access: proxy
    # Prometheus в compose с --web.route-prefix=/prometheus — API только под этим префиксом.
    url: http://prometheus:9090/prometheus
    isDefault: true
    editable: false

