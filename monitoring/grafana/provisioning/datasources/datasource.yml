apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Без явного uid: на части сборок Grafana (12+) провижининг с uid даёт
    # "Datasource provisioning error: data source not found" при старте.
    access: proxy
    # Prometheus в compose с --web.route-prefix=/prometheus — API только под этим префиксом.
    url: http://prometheus:9090/prometheus
    isDefault: true
    editable: false

