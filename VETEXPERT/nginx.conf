server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Базовые заголовки на edge (дубли NPM — не мешает)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 12m;
  client_body_timeout 25s;
  client_header_timeout 10s;
  send_timeout 60s;

  # Запрет типичных утечек через статик
  location ~* /\.(env|git) {
    return 403;
  }
  location ~* \.(sql|log)$ {
    return 403;
  }
  location ^~ /backup/ {
    return 403;
  }

  # SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API proxy to backend service in compose
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Monitoring (internal-only; protect with basic-auth at edge if needed)
  # Grafana is configured to serve from /grafana subpath.
  location /grafana/ {
    # Basic-auth is enabled if /etc/nginx/auth/monitoring.htpasswd exists.
    auth_basic "Monitoring";
    auth_basic_user_file /etc/nginx/auth/monitoring.htpasswd;

    proxy_pass http://grafana:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Prometheus UI is configured with external-url /prometheus/
  location /prometheus/ {
    auth_basic "Monitoring";
    auth_basic_user_file /etc/nginx/auth/monitoring.htpasswd;

    proxy_pass http://prometheus:9090/prometheus/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploaded assets (served by backend static handler)
  location /uploads/ {
    proxy_pass http://backend:3000/uploads/;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
