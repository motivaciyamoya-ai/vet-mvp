server {
  listen 80;
  server_name _;

  # Docker embedded DNS resolver (so upstream names can be resolved at request time).
  resolver 127.0.0.11 valid=30s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  if ($host != $canonical_host) {
    return 301 $forwarded_scheme://$canonical_host$request_uri;
  }

  # Тело при реальном 404 (неизвестный путь вне SPA); см. public/404.html в сборке Vite.
  error_page 404 /404.html;
  location = /404.html {
    internal;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
  }

  # SPA: не кэшировать shell — иначе после деплоя браузер держит старый JS без пункта «Почта».
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    expires off;
    try_files $uri =404;
  }

  # TTFB: при использовании NPM/Cloudflare включите кэш HTML только осознанно; статику и /uploads лучше отдавать с CDN.
  # Базовые заголовки на edge (дубли NPM — не мешает)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 12m;
  client_body_timeout 25s;
  client_header_timeout 10s;
  send_timeout 60s;

  # Запрет типичных утечек через статик
  location ~* /\.(env|git) {
    return 403;
  }
  location ~* \.(sql|log)$ {
    return 403;
  }
  location ^~ /backup/ {
    return 403;
  }

  # Динамическая карта сайта из API (статьи и темы форума из БД)
  location = /sitemap.xml {
    proxy_pass http://backend:3000/api/reference/sitemap.xml;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
  }

  # Vite: хэш в имени файла — длинный кэш безопасен после деплоя (новый index.html тянет новые URL).
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA: сначала реальные файлы (favicon, webmanifest…), иначе — только известные префиксы → index.html; иначе HTTP 404.
  location / {
    try_files $uri $uri/ @spa;
  }

  location @spa {
    if ($spa_ok = 0) {
      return 404;
    }
    rewrite ^ /index.html break;
  }

  # Если в БД Grafana когда-то сохранился root_url без subpath, HTML тянет /public/build/…
  location ^~ /public/ {
    set $grafana_upstream grafana:3000;
    rewrite ^/public/(.*)$ /grafana/public/$1 break;
    proxy_pass http://$grafana_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
  }

  # API proxy to backend service in compose
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
  }

  # Internal auth_request endpoint: checks admin session/JWT via backend.
  location = /_admin_monitoring_auth {
    internal;
    # Вне /api/: иначе при strip_prefix на edge путь на бэкенде может стать не /api/monitoring/auth → middleware не срабатывает.
    proxy_pass http://backend:3000/__vet/monitoring-auth;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  # Monitoring (internal-only; protect with basic-auth at edge if needed)
  # Grafana is configured to serve from /grafana subpath.
  location = /grafana {
    return 301 /grafana/;
  }

  # Статика Grafana: без auth_request (см. документацию Grafana — иначе 401 вместо .js).
  location ^~ /grafana/public/ {
    set $grafana_upstream grafana:3000;
    # Как в официальном туториале: proxy_pass без URI — на апстрим уходит полный путь /grafana/…
    proxy_pass http://$grafana_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 15s;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
  }

  # Bootdata фронта (без auth_request).
  location ^~ /grafana/api/frontend/ {
    set $grafana_upstream grafana:3000;
    proxy_pass http://$grafana_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 15s;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
  }

  # Ассеты плагинов (чанки .js), иначе часть сборок Grafana не грузится.
  location ^~ /grafana/api/plugins/ {
    set $grafana_upstream grafana:3000;
    proxy_pass http://$grafana_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 15s;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
  }

  # Grafana Live (WebSocket) — отдельный блок как в https://grafana.com/tutorials/run-grafana-behind-a-proxy/
  location ^~ /grafana/api/live/ {
    auth_request /_admin_monitoring_auth;

    set $grafana_upstream grafana:3000;
    proxy_pass http://$grafana_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location /grafana/ {
    auth_request /_admin_monitoring_auth;

    set $grafana_upstream grafana:3000;
    proxy_pass http://$grafana_upstream;
    proxy_http_version 1.1;
    # Не передаём Connection: close на каждый запрос (map даёт close без Upgrade) —
    # часть сборок Grafana/nginx даёт 502 на длинных сессиях / ds/query.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

  # Prometheus UI is configured with external-url /prometheus/
  location /prometheus/ {
    auth_request /_admin_monitoring_auth;

    set $prom_upstream prometheus:9090;
    proxy_pass http://$prom_upstream/prometheus/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
  }

  # Uploaded assets (served by backend static handler). Имена файлов с UUID — безопасный длинный кэш; перед CDN вынесите этот путь в облако.
  location /uploads/ {
    proxy_pass http://backend:3000/uploads/;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
  }
}
