worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_comp_level 5;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

  # Ускоряет повторное чтение маленьких статических файлов с диска (favicon и т.п.).
  open_file_cache max=8000 inactive=60s;
  open_file_cache_valid 45s;
  open_file_cache_min_uses 2;

  # За NPM/Cloudflare TLS снимается до контейнера: реальный scheme приходит в X-Forwarded-Proto.
  # Если подставлять только $scheme (всегда http), Grafana и др. могут бесконечно редиректить на https.
  map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Канонический хост без www (редирект 301 на уровне контейнера; дублируйте на NPM/Cloudflare при необходимости).
  map $host $canonical_host {
    default $host;
    ~*^www\.(.+)$ $1;
  }

  # Разрешённые префиксы SPA: всё остальное — HTTP 404 и статический 404.html (аудиторы и краулеры без JS).
  map $uri $spa_ok {
    default 0;
    "~*^/$" 1;
    "~*^/index\\.html$" 1;
    "~*^/(login|register|verify-email)/?$" 1;
    "~*^/(forum|articles|events|tools|specialists|marketplace|profile|messages|privacy|cookies)(/|$)" 1;
    "~*^/admin(/|$)" 1;
    "~*^/users/[^/]+/?$" 1;
    "~*^/.well-known/" 1;
  }

  include /etc/nginx/conf.d/*.conf;
}
